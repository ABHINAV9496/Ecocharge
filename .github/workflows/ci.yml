name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check django-backend/ fastapi-ai/

  test-fastapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-fastapi-${{ hashFiles('fastapi-ai/requirements.txt') }}
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  test-django:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: django-backend
    env:
      DATABASE_HOST: postgis
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ecouser
          POSTGRES_PASSWORD: ecopass
          POSTGRES_DB: ecocharge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-django-${{ hashFiles('django-backend/requirements.txt') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - run: pip install -r requirements.txt
      - run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Django image
        run: docker build -t ecocharge-django django-backend/
      - name: Build FastAPI image
        run: docker build -t ecocharge-fastapi fastapi-ai/
