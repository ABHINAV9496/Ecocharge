services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ecocharge
      POSTGRES_USER: ecouser
      POSTGRES_PASSWORD: ecopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  django:
    build: ./django-backend
    command: sh -c "python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./django-backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  fastapi:
    build: ./fastapi-service
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./fastapi-service:/app
    ports:
      - "8001:8001"
    env_file: .env

  celery_worker:
    build: ./django-backend
    command: celery -A core worker --loglevel=info
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - django

  celery_beat:
    build: ./django-backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - django

  mqtt_consumer:
    build: ./django-backend
    command: sh -c "PYTHONPATH=/app python stations/mqtt_consumer.py"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - mosquitto
      - django

  mqtt_publisher:
    build: ./django-backend
    command: sh -c "PYTHONPATH=/app python stations/mqtt_publisher.py"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - mosquitto

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - django
      - fastapi

volumes:
  postgres_data: