services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ecocharge
      POSTGRES_USER: ecouser
      POSTGRES_PASSWORD: ecopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build: ./django-backend
    command: sh -c "python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 core.asgi:application"
    volumes:
      - ./django-backend:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  fastapi:
    build: ./fastapi-ai
    command: uvicorn app:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./fastapi-ai:/app
    ports:
      - "8001:8001"
    env_file: .env

  celery_worker:
    build: ./django-backend
    command: celery -A core worker --loglevel=info
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - django

  celery_beat:
    build: ./django-backend
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./django-backend:/app
    env_file: .env
    depends_on:
      - postgres
      - redis
      - django

volumes:
  postgres_data: