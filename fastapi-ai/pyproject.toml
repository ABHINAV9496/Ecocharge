[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"agent/tool_summarizer.py" = ["E501"]
"orchestrator/executor.py" = ["E501"]
"orchestrator/verifier.py" = ["E501"]
"services/reasoning_service.py" = ["E501"]
"tools/mock_booking_tool.py" = ["E501"]
"tools/real_booking_tool.py" = ["E501"]
"tools/real_station_tool.py" = ["E501"]
"tools/real_trip_tool.py" = ["E501"]

[tool.ruff.format]
quote-style = "single"
